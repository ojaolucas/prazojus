server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento instantâneo
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache de 1 ano para arquivos estáticos versionados por hash (Vite)
    location ~* \.(?:css|js|woff2?|svg|ttf|eot|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA (Single Page Application)
    # Garante que rotas recarregadas no navegador não retornem erro 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativa logs de favicon e robots para economia de I/O
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Cabeçalhos de Segurança Forense
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

